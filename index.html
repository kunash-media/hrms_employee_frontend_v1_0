
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem;background:#EEF3F8;overflow:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(31,111,127,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(31,111,127,0.08) 1px,transparent 1px);background-size:42px 42px;opacity:.6;pointer-events:none;z-index:0;}
  body::after{content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(95,175,194,.10),transparent 45%),radial-gradient(circle at 85% 70%,rgba(31,111,127,.08),transparent 50%);pointer-events:none;z-index:0;}
  .orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.22;z-index:0;pointer-events:none;animation:floatOrbs 14s ease-in-out infinite alternate;}
  .orb.one{width:240px;height:240px;background:#5FAFC2;top:8%;left:6%;}
  .orb.two{width:280px;height:280px;background:#1F6F7F;bottom:8%;right:10%;}
  .orb.three{width:200px;height:200px;background:#93C5FD;top:55%;left:45%;}
  @keyframes floatOrbs{0%{transform:translateY(0) scale(1);}100%{transform:translateY(-18px) scale(1.05);}}
  .login-container{position:relative;z-index:2;width:100%;max-width:400px;background:#fff;border-radius:1.5rem;box-shadow:0 20px 35px -10px rgba(15,23,42,.12),0 1px 3px rgba(0,0,0,.05);overflow:hidden;}
  .brand-header{background:linear-gradient(135deg,#1F6F7F 0%,#145C6B 100%);padding:1.2rem 1.2rem 1rem;text-align:center;}
  .logo-circle{background:rgba(255,255,255,.12);width:52px;height:52px;margin:0 auto .7rem;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2);}
  .logo-circle i{font-size:1.8rem;color:#fff;}
  .brand-header h1{font-family:'Poppins',sans-serif;font-weight:600;font-size:1.4rem;color:#fff;margin-bottom:.2rem;}
  .brand-header p{color:rgba(255,255,255,.85);font-size:.7rem;}
  .form-body{padding:1.4rem 1.6rem 1.5rem;}
  .input-group{margin-bottom:1rem;}
  .input-group label{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.75rem;margin-bottom:.4rem;color:#334155;}
  .input-group label i{color:#5FAFC2;font-size:.75rem;width:1rem;}
  .input-field{position:relative;display:flex;align-items:center;}
  .input-field i.field-icon{position:absolute;left:.9rem;color:#94A3B8;font-size:.9rem;pointer-events:none;}
  .input-field input{width:100%;padding:.65rem .9rem .65rem 2.4rem;font-size:.85rem;font-weight:500;font-family:'Inter',sans-serif;background:#fff;border:1.5px solid #E2E8F0;border-radius:1rem;outline:none;transition:all .2s;color:#0F172A;}
  .input-field input:focus{border-color:#1F6F7F;box-shadow:0 0 0 3px rgba(31,111,127,.08);}
  .input-field input:hover{border-color:#5FAFC2;}
  .password-toggle{position:absolute;right:.9rem;background:transparent;border:none;cursor:pointer;font-size:.9rem;color:#94A3B8;transition:color .2s;display:flex;align-items:center;padding:0;}
  .password-toggle:hover{color:#1F6F7F;}
  .login-btn{width:100%;background:linear-gradient(105deg,#1F6F7F 0%,#5FAFC2 100%);border:none;padding:.75rem 1rem;font-family:'Poppins',sans-serif;font-weight:600;font-size:.85rem;border-radius:2rem;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6rem;transition:all .2s;box-shadow:0 4px 10px rgba(31,111,127,.2);}
  .login-btn:hover:not(:disabled){background:linear-gradient(105deg,#145C6B 0%,#4A9BB0 100%);transform:translateY(-1px);box-shadow:0 6px 14px rgba(31,111,127,.3);}
  .login-btn:disabled{opacity:.7;cursor:not-allowed;}
  .toast{position:fixed;top:16px;right:16px;z-index:9999;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:500;font-family:'Inter',sans-serif;color:#fff;opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.error{background:#E56C6C;}
  .toast.success{background:#6FAF2E;}
  .toast.warning{background:#F59E0B;}
</style>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>

<div class="toast" id="toast"></div>

<div class="login-container">
  <div class="brand-header">
    <div class="logo-circle"><i class="fas fa-briefcase"></i></div>
    <h1>Employee Portal</h1>
    <p>secure dashboard access</p>
  </div>
  <div class="form-body">
    <div class="input-group">
      <label><i class="fas fa-id-card"></i> Employee ID</label>
      <div class="input-field">
        <i class="fas fa-user-circle field-icon"></i>
        <input type="text" id="empId" placeholder="Enter your Employee ID" autocomplete="username" required>
      </div>
    </div>
    <div class="input-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <div class="input-field">
        <i class="fas fa-key field-icon"></i>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" id="togglePasswordBtn">
          <i class="far fa-eye-slash" id="toggleIcon"></i>
        </button>
      </div>
    </div>
    <div style="margin:.5rem 0 1.2rem;text-align:right;">
      <a href="#" id="forgotLink" style="font-size:.75rem;font-weight:500;color:#5FAFC2;text-decoration:none;">
        <i class="fas fa-question-circle"></i> Forgot password?
      </a>
    </div>
    <button class="login-btn" id="loginBtn">
      <span id="btnText">Access Dashboard</span>
      <i class="fas fa-arrow-right-to-bracket" id="btnIcon"></i>
    </button>
  </div>
</div>

<script>
(function(){
  const BASE_URL = 'http://localhost:8086';
  const LOGIN_URL = BASE_URL + '/api/employees/employee-login';

  const empIdInput = document.getElementById('empId');
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('togglePasswordBtn');
  const toggleIcon = document.getElementById('toggleIcon');
  const loginBtn = document.getElementById('loginBtn');
  const btnText = document.getElementById('btnText');
  const btnIcon = document.getElementById('btnIcon');
  const forgotLink = document.getElementById('forgotLink');
  const toast = document.getElementById('toast');

  let toastTimer;
  function showToast(message, type='error'){
    clearTimeout(toastTimer);
    toast.textContent = (type==='success'?'✓ ':type==='warning'?'⚠ ':'✕ ') + message;
    toast.className = 'toast show ' + type;
    toastTimer = setTimeout(()=>{ toast.className='toast'; }, 3500);
  }

  toggleBtn.addEventListener('click', ()=>{
    const isPass = passwordInput.type === 'password';
    passwordInput.type = isPass ? 'text' : 'password';
    toggleIcon.className = isPass ? 'far fa-eye' : 'far fa-eye-slash';
  });

  forgotLink.addEventListener('click', e=>{
    e.preventDefault();
    showToast('Please contact your HR administrator to reset your password.', 'warning');
  });

  function setLoading(loading){
    loginBtn.disabled = loading;
    btnText.textContent = loading ? 'Signing in...' : 'Access Dashboard';
    btnIcon.className = loading ? 'fas fa-spinner fa-pulse' : 'fas fa-arrow-right-to-bracket';
  }

  function storeSession(data){
    localStorage.setItem('hrms_auth', 'true');
    localStorage.setItem('hrms_employee_prime_id', data.employeePrimeId);
    localStorage.setItem('hrms_employee_id', data.employeeId);
    localStorage.setItem('hrms_first_name', data.firstName);
    localStorage.setItem('hrms_last_name', data.lastName);
    localStorage.setItem('hrms_department', data.department);
    localStorage.setItem('hrms_designation', data.designation);
    localStorage.setItem('hrms_work_email', data.workEmail);
    localStorage.setItem('hrms_login_ts', Date.now().toString());
  }

  loginBtn.addEventListener('click', async ()=>{
    const employeeId = empIdInput.value.trim();
    const password = passwordInput.value.trim();

    if(!employeeId){ showToast('Please enter your Employee ID', 'error'); empIdInput.focus(); return; }
    if(!password){ showToast('Password is required', 'error'); passwordInput.focus(); return; }

    setLoading(true);

    try {
      const res = await fetch(`${LOGIN_URL}?employeeId=${encodeURIComponent(employeeId)}&password=${encodeURIComponent(password)}`, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      });

      if(res.ok){
        const data = await res.json();
        storeSession(data);
        showToast(`Welcome, ${data.firstName} ${data.lastName}! Redirecting...`, 'success');
        setTimeout(()=>{ window.location.href = '/pages/dashboard.html'; }, 1200);
      } else if(res.status === 401 || res.status === 403){
        showToast('Invalid Employee ID or password.', 'error');
        passwordInput.value = '';
        passwordInput.focus();
        setLoading(false);
      } else if(res.status === 404){
        showToast('Employee not found. Please check your ID.', 'error');
        setLoading(false);
      } else {
        showToast('Something went wrong. Please try again.', 'error');
        setLoading(false);
      }
    } catch(err){
      showToast('Unable to reach server. Check your connection.', 'error');
      setLoading(false);
    }
  });

  document.addEventListener('keydown', e=>{ if(e.key==='Enter') loginBtn.click(); });

  localStorage.removeItem('hrms_auth');
  localStorage.removeItem('hrms_employee_prime_id');
  localStorage.removeItem('hrms_employee_id');
  localStorage.removeItem('hrms_first_name');
  localStorage.removeItem('hrms_last_name');
  localStorage.removeItem('hrms_department');
  localStorage.removeItem('hrms_designation');
  localStorage.removeItem('hrms_work_email');
  localStorage.removeItem('hrms_login_ts');
})();
</script>
