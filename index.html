<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
<title>Login | SIEC</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
  rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: linear-gradient(135deg, #a8e6e3 0%, #e0f2ee 100%);
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(31, 111, 127, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31, 111, 127, 0.06) 1px, transparent 1px);
    background-size: 45px 45px;
    opacity: .7;
    pointer-events: none;
    z-index: 0;
  }

  .main-wrapper {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1080px;
    height: 520px;
    background: white;
    border-radius: 28px;
    overflow: hidden;
    display: flex;
    border: 1px solid #1F6F7F;
  }

  /* Left Side */
  .illustration-side {
    flex: 1.05;
    background: #d5efef;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    overflow: hidden;
  }

  .illustration-top {
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 2px 24px 0;
  }

  .illustration-top img.side-logo {
    height: 90px;
    width: 100px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .illustration-address {
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    color: #1F6F7F;
    line-height: 1.5;
    font-weight: 500;
  }

  .illustration-side img.main-illustration {
    width: 100%;
    flex: 1;
    object-fit: cover;
    object-position: center top;
    filter: drop-shadow(0 20px 30px rgba(31, 111, 127, .15));
    margin-top: -10px;
  }

  /* Right Side */
  .form-side {
    flex: 1;
    background: white;
    padding: 2.4rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .header-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 2rem;
  }

  .form-side h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.6rem;
    font-weight: 500;
    color: #1F6F7F;
    margin: 0;
  }

  .form-side p {
    color: #64748B;
    font-size: 0.85rem;
    margin: 2px 0 0;
  }

  .input-group { margin-bottom: 1rem; }

  .input-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 0.78rem;
    margin-bottom: 8px;
    color: #334155;
  }

  .input-group label i { color: #5FAFC2; }

  .input-field { position: relative; }

  .input-field i.field-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #94A3B8;
    font-size: 0.95rem;
  }

  .input-field input {
    width: 100%;
    padding: 0.85rem 1rem 0.85rem 3rem;
    font-size: 0.95rem;
    font-weight: 500;
    border: 1.5px solid #b2caea;
    border-radius: 11px;
    outline: none;
    transition: all 0.2s;
  }

  .input-field input:focus {
    border-color: #1F6F7F;
    box-shadow: 0 0 0 3px rgba(31, 111, 127, 0.08);
  }

  .password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 1rem;
    color: #03919e;
    cursor: pointer;
  }

  .login-btn {
    width: 100%;
    background: linear-gradient(105deg, #1F6F7F 0%, #5FAFC2 100%);
    border: none;
    padding: 0.8rem;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    margin-top: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    box-shadow: 0 5px 14px rgba(31, 111, 127, 0.25);
    transition: all 0.2s;
  }

  .login-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(31, 111, 127, 0.3);
  }

  .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

  .forgot-link {
    display: flex;
    justify-content: flex-end;
    margin: 0 1.2rem;
  }

  .forgot-link a {
    display: inline-block;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: 500;
    color: #1F6F7F;
    background: #E6F4F6;
    border-radius: 999px;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .forgot-link a:hover {
    background: #d4eef2;
    color: #145c6b;
    transform: translateY(-1px);
  }

  .terms {
    margin-top: auto;
    text-align: center;
    font-size: 0.7rem;
    color: #64748B;
    padding-top: 1rem;
  }

  .terms a { color: #5FAFC2; text-decoration: none; }

  @media (max-width: 900px) {
    .illustration-side { display: none; }
    .form-side { padding: 1.4rem 1.2rem; }
    .form-side h1 { font-size: 1.4rem; }
  }

  @media (max-width: 600px) {
    .main-wrapper { height: auto; }
    .form-side { padding: 1.2rem 1rem; }
    .login-btn { font-size: 0.9rem; padding: 0.75rem; }
    .input-field input { font-size: 0.88rem; }
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    opacity: 0;
    transform: translateY(-10px);
    transition: all .3s;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: #E56C6C; }
  .toast.success { background: #6FAF2E; }
  .toast.warning { background: #F59E0B; }
</style>
</head>

<body>

<div class="toast" id="toast"></div>

<div class="main-wrapper">

  <!-- Left Illustration -->
  <div class="illustration-side">
    <div class="illustration-top">
      <img src="/Images/logo.png" alt="SIEC Logo" class="side-logo">
      <div class="illustration-address">
        Address : Office-401, Sanskriti Arcade, Kaspate Wasti, Wakad, Pune - 411057
      </div>
    </div>
    <img src="/Images/login.png" alt="Employee working" class="main-illustration">
  </div>

  <!-- Right Form -->
  <div class="form-side">
    <div class="header-row">
      <div class="header-text">
        <h1>Employee Login</h1>
      </div>
    </div>

    <div class="input-group">
      <label><i class="fas fa-id-card"></i> Employee ID</label>
      <div class="input-field">
        <i class="fas fa-user-circle field-icon"></i>
        <input type="text" id="empId" placeholder="Enter your Employee ID" autocomplete="username" required>
      </div>
    </div>

    <div class="input-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <div class="input-field">
        <i class="fas fa-key field-icon"></i>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" id="togglePasswordBtn">
          <i class="far fa-eye-slash" id="toggleIcon"></i>
        </button>
      </div>
    </div>

    <div class="forgot-link">
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>

    <button class="login-btn" id="loginBtn">
      <span id="btnText">Sign In</span>
      <i class="fas fa-arrow-right-to-bracket" id="btnIcon"></i>
    </button>

    <div class="terms">
      By signing in, you agree to SIEC's
      <a href="#">Terms of Services</a> and
      <a href="#">Privacy Policy</a>.
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── CONFIG ─────────────────────────────────────────── */
  const BASE_URL    = 'http://localhost:8086';
  const LOGIN_URL   = BASE_URL + '/api/employee/auth/login';
  const DASHBOARD   = '/pages/dashboard.html';

  /* ── ELEMENTS ───────────────────────────────────────── */
  const empIdInput  = document.getElementById('empId');
  const pwdInput    = document.getElementById('password');
  const toggleBtn   = document.getElementById('togglePasswordBtn');
  const toggleIcon  = document.getElementById('toggleIcon');
  const loginBtn    = document.getElementById('loginBtn');
  const btnText     = document.getElementById('btnText');
  const btnIcon     = document.getElementById('btnIcon');
  const forgotLink  = document.getElementById('forgotLink');
  const toast       = document.getElementById('toast');

  /* ── CLEAR STALE SESSION on page load ───────────────── */
  // If user lands back on login, their session is gone
  const SESSION_DISPLAY_KEYS = [
    'hrms_authenticated',
    'hrms_employee_id', 'hrms_employee_prime_id',
    'hrms_first_name',  'hrms_full_name',
    'hrms_designation', 'hrms_department',
    'hrms_work_email',  'hrms_login_ts',
  ];
  SESSION_DISPLAY_KEYS.forEach(k => localStorage.removeItem(k));

  /* ── TOAST ──────────────────────────────────────────── */
  let toastTimer;
  function showToast(message, type = 'error') {
    clearTimeout(toastTimer);
    const prefix = type === 'success' ? '✓ ' : type === 'warning' ? '⚠ ' : '✕ ';
    toast.textContent = prefix + message;
    toast.className = `toast show ${type}`;
    toastTimer = setTimeout(() => { toast.className = 'toast'; }, 4000);
  }

  /* ── PASSWORD TOGGLE ────────────────────────────────── */
  toggleBtn.addEventListener('click', () => {
    const isPass = pwdInput.type === 'password';
    pwdInput.type = isPass ? 'text' : 'password';
    toggleIcon.className = isPass ? 'far fa-eye' : 'far fa-eye-slash';
  });

  /* ── FORGOT PASSWORD ────────────────────────────────── */
  forgotLink.addEventListener('click', e => {
    e.preventDefault();
    showToast('Please contact your HR administrator to reset your password.', 'warning');
  });

  /* ── LOADING STATE ──────────────────────────────────── */
  function setLoading(loading) {
    loginBtn.disabled = loading;
    btnText.textContent = loading ? 'Signing in…' : 'Sign In';
    btnIcon.className = loading
      ? 'fas fa-spinner fa-pulse'
      : 'fas fa-arrow-right-to-bracket';
  }

  /* ── STORE DISPLAY DATA (no tokens — those are HttpOnly cookies) ── */
  function storeDisplaySession(data) {
    localStorage.setItem('hrms_authenticated',      'true');
    localStorage.setItem('hrms_employee_prime_id',  String(data.employeePrimeId ?? ''));
    localStorage.setItem('hrms_employee_id',        data.employeeId    ?? '');
    // Server returns fullName; split for firstName
    const fullName  = data.fullName ?? '';
    const firstName = fullName.split(' ')[0] ?? '';
    const lastName = fullName.split(' ').slice(2).join(' ') ?? '';
    
    localStorage.setItem('hrms_full_name',    fullName);
    localStorage.setItem('hrms_first_name',   firstName);
    localStorage.setItem('hrms_last_name',   lastName);    
    localStorage.setItem('hrms_designation',  data.designation ?? '');
    localStorage.setItem('hrms_department',   data.department  ?? '');
    localStorage.setItem('hrms_login_ts',     String(Date.now()));
  }

  /* ── LOGIN HANDLER ──────────────────────────────────── */
  async function handleLogin() {
    const employeeId = empIdInput.value.trim();
    const password   = pwdInput.value;           // do NOT trim passwords

    if (!employeeId) {
      showToast('Please enter your Employee ID', 'error');
      empIdInput.focus();
      return;
    }
    if (!password) {
      showToast('Password is required', 'error');
      pwdInput.focus();
      return;
    }

    setLoading(true);

    try {
      const res = await fetch(LOGIN_URL, {
        method: 'POST',
        credentials: 'include',                  // ← lets browser receive + store HttpOnly cookies
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ employeeId, password }),
      });

      if (res.ok) {
        const data = await res.json();
        storeDisplaySession(data);
        showToast(`Welcome back, ${data.fullName?.split(' ')[0] || 'there'}!`, 'success');
        setTimeout(() => { window.location.href = DASHBOARD; }, 1300);
        // Don't call setLoading(false) — page is navigating away
        return;
      }

      // Handle specific HTTP error codes
      if (res.status === 401 || res.status === 403) {
        showToast('Invalid Employee ID or password.', 'error');
        pwdInput.value = '';
        pwdInput.focus();
      } else if (res.status === 404) {
        showToast('Employee not found. Check your Employee ID.', 'error');
      } else if (res.status === 429) {
        showToast('Too many attempts. Please wait and try again.', 'warning');
      } else if (res.status >= 500) {
        showToast('Server error. Please try again later.', 'error');
      } else {
        showToast('Login failed. Please try again.', 'error');
      }

    } catch (err) {
      // Network failure or CORS issue
      showToast('Unable to connect to server. Check your connection.', 'error');
    }

    setLoading(false);
  }

  /* ── EVENT BINDINGS ─────────────────────────────────── */
  loginBtn.addEventListener('click', handleLogin);

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !loginBtn.disabled) handleLogin();
  });

})();
</script>

</body>
</html>
