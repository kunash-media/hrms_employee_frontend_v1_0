<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Login | SIEC</title>
</head>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: linear-gradient(135deg, #a8e6e3 0%, #e0f2ee 100%);
    overflow: hidden;
  }

  /* Background decorative elements */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: linear-gradient(rgba(31, 111, 127, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31, 111, 127, 0.06) 1px, transparent 1px);
    background-size: 45px 45px;
    opacity: .7;
    pointer-events: none;
    z-index: 0;
  }

  .main-wrapper {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1080px;
    height: 520px;
    background: white;
    border-radius: 28px;
    overflow: hidden;

    display: flex;
    border: 1px solid #1F6F7F;
  }

  /* Left Side - Illustration */
  .illustration-side {
    flex: 1.05;
    background: #d5efef;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    overflow: hidden;
  }

  /* Logo + Address on illustration side */
  .illustration-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding-top: 18px;
    z-index: 3;
    width: 100%;
  }

  .illustration-top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 24px 0;
}

.illustration-top img.side-logo {
    height: 50px;
    width: 100px;
    object-fit: contain;
    flex-shrink: 0;
}

.illustration-address {
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    color: #1F6F7F;
    line-height: 1.5;
    font-weight: 500;
}

.illustration-side img.main-illustration {
    width: 100%;
    flex: 1;
    object-fit: cover;
    object-position: center top;
    filter: drop-shadow(0 20px 30px rgba(31, 111, 127, .15));
    margin-top: -10px;
}

  /* Header Row (Logo + Title) */
  .header-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 2rem;
  }

  /* Right Side - Form Card */
  .form-side {
    flex: 1;
    background: white;
    padding: 2.4rem 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Title */
  .form-side h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.6rem;
    /* fixed */
    font-weight: 500;
    color: #1F6F7F;
    margin: 0;
  }

  .form-side p {
    color: #64748B;
    font-size: 0.30 rem;
    margin: 2px 0 0;
  }

  /* Inputs */
  .input-group {
    margin-bottom: 1rem;
  }

  .input-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 0.78rem;
    margin-bottom: 8px;
    color: #334155;
  }

  .input-group label i {
    color: #5FAFC2;
  }

  .input-field {
    position: relative;
  }

  .input-field i.field-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #94A3B8;
    font-size: 0.95rem;
  }

  .input-field input {
    width: 100%;
    padding: 0.85rem 1rem 0.85rem 3rem;
    font-size: 0.95rem;
    font-weight: 500;
    border: 1.5px solid #b2caea;
    border-radius: 11px;
    outline: none;
    transition: all 0.2s;
  }

  .input-field input:focus {
    border-color: #1F6F7F;
    box-shadow: 0 0 0 3px rgba(31, 111, 127, 0.08);
  }

  /* Password toggle */
  .password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 1rem;
    color: #03919e;
    cursor: pointer;
  }

  /* Button */
  .login-btn {
    width: 100%;
    background: linear-gradient(105deg, #1F6F7F 0%, #5FAFC2 100%);
    border: none;
    padding: 0.8rem;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    margin-top: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    box-shadow: 0 5px 14px rgba(31, 111, 127, 0.25);
    transition: all 0.2s;
  }

  .login-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 18px rgba(31, 111, 127, 0.3);
  }

  /* Forgot */
  .forgot-link {
    display: flex;
    justify-content: flex-end;
    margin: 0 1.2rem;
  }

  .forgot-link a {
    display: inline-block;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: 500;
    color: #1F6F7F;
    background: #E6F4F6;
    border-radius: 999px;
    /* pill shape */
    text-decoration: none;
    transition: all 0.2s ease;
  }

  /* Hover effect */
  .forgot-link a:hover {
    background: #d4eef2;
    color: #145c6b;
    transform: translateY(-1px);
  }

  /* Footer */
  .terms {
    margin-top: auto;
    text-align: center;
    font-size: 0.7rem;
    color: #64748B;
    padding-top: 1rem;
  }

  .terms a {
    color: #5FAFC2;
    text-decoration: none;
  }

  /* ========================= */
  /* 📱 Responsive Fix */
  /* ========================= */
  @media (max-width: 900px) {
    .form-side {
      padding: 1.4rem 1.2rem;
    }

    .header-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .form-side h1 {
      font-size: 1.4rem;
    }

    .form-side p {
      font-size: 0.85rem;
    }
  }

  @media (max-width: 600px) {
    .form-side {
      padding: 1.2rem 1rem;
    }

    .login-btn {
      font-size: 0.9rem;
      padding: 0.75rem;
    }

    .input-field input {
      font-size: 0.88rem;
    }
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    opacity: 0;
    transform: translateY(-10px);
    transition: all .3s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .toast.error {
    background: #E56C6C;
  }

  .toast.success {
    background: #6FAF2E;
  }

  .toast.warning {
    background: #F59E0B;
  }


</style>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
  rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<div class="toast" id="toast"></div>

<div class="main-wrapper">

  <!-- Left Illustration -->
  <div class="illustration-side">

    <!-- Logo + Address at top center -->
    <div class="illustration-top">
      <img src="/Images/logo.png" alt="SIEC Logo" class="side-logo">
      <div class="illustration-address">
        Address : Office-401, Sanskriti Arcade, Kaspate Wasti, Wakad, Pune - 411057
      </div>
    </div>

    <img src="/Images/login.png" alt="Employee working" id="illustration" class="main-illustration">
  </div>

  <!-- Right Form -->
  <div class="form-side">
    <div class="header-row">
      <div class="header-text">
        <h1>Employee Login</h1>
      </div>
    </div>

    <div class="input-group">
      <label><i class="fas fa-id-card"></i> Employee ID</label>
      <div class="input-field">
        <i class="fas fa-user-circle field-icon"></i>
        <input type="text" id="empId" placeholder="Enter your Employee ID" autocomplete="username" required>
      </div>
    </div>

    <div class="input-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <div class="input-field">
        <i class="fas fa-key field-icon"></i>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" id="togglePasswordBtn">
          <i class="far fa-eye-slash" id="toggleIcon"></i>
        </button>
      </div>
    </div>

    <div class="forgot-link">
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>

    <button class="login-btn" id="loginBtn">
      <span id="btnText">Sign In</span>
      <i class="fas fa-arrow-right-to-bracket" id="btnIcon"></i>
    </button>

    <div class="terms">
      By signing in, you agree to Messimo's
      <a href="#">Terms of Services</a> and
      <a href="#">Privacy Policy</a>.
    </div>
  </div>
</div>

<script>
  (function () {
    const BASE_URL = 'http://localhost:8086';
    const LOGIN_URL = BASE_URL + '/api/employees/employee-login';

    const empIdInput = document.getElementById('empId');
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const toggleIcon = document.getElementById('toggleIcon');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const forgotLink = document.getElementById('forgotLink');
    const toast = document.getElementById('toast');

    let toastTimer;
    function showToast(message, type = 'error') {
      clearTimeout(toastTimer);
      toast.textContent = (type === 'success' ? '✓ ' : type === 'warning' ? '⚠ ' : '✕ ') + message;
      toast.className = `toast show ${type}`;
      toastTimer = setTimeout(() => { toast.className = 'toast'; }, 4000);
    }

    toggleBtn.addEventListener('click', () => {
      const isPass = passwordInput.type === 'password';
      passwordInput.type = isPass ? 'text' : 'password';
      toggleIcon.className = isPass ? 'far fa-eye' : 'far fa-eye-slash';
    });

    forgotLink.addEventListener('click', e => {
      e.preventDefault();
      showToast('Please contact your HR administrator to reset your password.', 'warning');
    });

    function setLoading(loading) {
      loginBtn.disabled = loading;
      btnText.textContent = loading ? 'Signing in...' : 'Sign In';
      btnIcon.className = loading ? 'fas fa-spinner fa-pulse' : 'fas fa-arrow-right-to-bracket';
    }

    function storeSession(data) {
      localStorage.setItem('hrms_auth', 'true');
      localStorage.setItem('hrms_employee_prime_id', data.employeePrimeId);
      localStorage.setItem('hrms_employee_id', data.employeeId);
      localStorage.setItem('hrms_first_name', data.firstName);
      localStorage.setItem('hrms_last_name', data.lastName);
      localStorage.setItem('hrms_department', data.department);
      localStorage.setItem('hrms_designation', data.designation);
      localStorage.setItem('hrms_work_email', data.workEmail);
      localStorage.setItem('hrms_login_ts', Date.now().toString());
    }

    loginBtn.addEventListener('click', async () => {
      const employeeId = empIdInput.value.trim();
      const password = passwordInput.value.trim();

      if (!employeeId) { showToast('Please enter your Employee ID', 'error'); empIdInput.focus(); return; }
      if (!password) { showToast('Password is required', 'error'); passwordInput.focus(); return; }

      setLoading(true);

      try {
        const res = await fetch(`${LOGIN_URL}?employeeId=${encodeURIComponent(employeeId)}&password=${encodeURIComponent(password)}`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });

        if (res.ok) {
          const data = await res.json();
          storeSession(data);
          showToast(`Welcome back, ${data.firstName}!`, 'success');
          setTimeout(() => { window.location.href = '/pages/dashboard.html'; }, 1300);
        } else if (res.status === 401 || res.status === 403) {
          showToast('Invalid Employee ID or password.', 'error');
          passwordInput.value = '';
          passwordInput.focus();
          setLoading(false);
        } else if (res.status === 404) {
          showToast('Employee not found.', 'error');
          setLoading(false);
        } else {
          showToast('Login failed. Please try again.', 'error');
          setLoading(false);
        }
      } catch (err) {
        showToast('Unable to connect to server.', 'error');
        setLoading(false);
      }
    });

    document.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });

    // Clear old session data
    localStorage.removeItem('hrms_auth');
    localStorage.removeItem('hrms_employee_prime_id');
    localStorage.removeItem('hrms_employee_id');
    localStorage.removeItem('hrms_first_name');
    localStorage.removeItem('hrms_last_name');
    localStorage.removeItem('hrms_department');
    localStorage.removeItem('hrms_designation');
    localStorage.removeItem('hrms_work_email');
    localStorage.removeItem('hrms_login_ts');
  })();
</script>
