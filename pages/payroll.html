  <!-- ═══════════════════════════════════════════════════════════
       PAYSLIP FORMAT OVERRIDE
       Loaded AFTER payroll.css on purpose, so these rules win the
       cascade for the .ps-* classes without editing payroll.css
       (payroll.css may be shared by other pages).
       Copied 1:1 from admin payslips.html so the employee payslip
       preview/PDF exactly mirrors the admin format.
  ════════════════════════════════════════════════════════════ -->
  <style id="ps-format-override">
    .payslip-container { max-width: 750px; margin: 0 auto; background: white; padding: 22px 26px; font-size: 12.5px; color: #111; }

    .ps-header { border: 2px solid #1B738C; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
    .ps-company-row { background: #1B738C; color: white; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
    .ps-company-logo-wrap { background: white; border-radius: 6px; padding: 3px; flex-shrink: 0; }
    .ps-company-logo-wrap img { width: 44px; height: 44px; object-fit: contain; display: block; }
    .ps-company-logo-wrap .ps-logo-fallback { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #1B738C; font-weight: 700; text-align: center; }
    .ps-company-text { flex: 1; text-align: center; }
    .ps-company-name { font-size: 15px; font-weight: 700; letter-spacing: .4px; }
    .ps-company-addr { font-size: 10.5px; opacity: .88; margin-top: 3px; }
    .ps-month-row    { text-align: center; padding: 6px; font-weight: 600; font-size: 12px; color: #1B738C; background: #e9f6fb; border-top: 1px solid #62C9EA; }

    .ps-emp-grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #1B738C; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
    .ps-emp-cell { display: flex; gap: 8px; padding: 6px 12px; border-bottom: 1px solid #d4edf5; }
    .ps-emp-cell:nth-child(odd)  { border-right: 1px solid #d4edf5; }
    .ps-emp-cell:nth-last-child(1), .ps-emp-cell:nth-last-child(2) { border-bottom: none; }
    .ps-emp-label { color: #1B738C; font-weight: 600; min-width: 120px; font-size: 11px; flex-shrink: 0; }
    .ps-emp-value { color: #222; font-size: 11px; }

    .ps-att-strip { display: grid; grid-template-columns: repeat(6,1fr); border: 1px solid #1B738C; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
    .ps-att-cell  { text-align: center; padding: 6px 4px; border-right: 1px solid #d4edf5; }
    .ps-att-cell:last-child { border-right: none; }
    .ps-att-val   { font-size: 14px; font-weight: 800; color: #1B738C; }
    .ps-att-val.lop  { color: #dc3545; }
    .ps-att-val.paid { color: #16a34a; }
    .ps-att-lbl   { font-size: 9.5px; color: #5a7c8a; margin-top: 2px; }
    .ps-att-head  { background: #1B738C; grid-column: 1/-1; text-align: center; padding: 4px; font-size: 10px; font-weight: 700; color: white; letter-spacing: .06em; text-transform: uppercase; }

    .ps-salary-table { width: 100%; border-collapse: collapse; border: 1px solid #1B738C; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
    .ps-salary-table thead th { background: #1B738C; color: white; padding: 7px 12px; font-size: 11.5px; text-align: left; font-weight: 600; }
    .ps-salary-table thead th.amt-col { text-align: right; }
    .ps-salary-table tbody td { padding: 6px 12px; font-size: 11.5px; border-bottom: 1px solid #e4f3f8; }
    .ps-salary-table tbody tr:last-child td { border-bottom: none; }
    .ps-salary-table tbody td.amt-col { text-align: right; }
    .ps-salary-table tbody tr.lop-row td { color: #dc3545; }
    .ps-salary-table tbody tr.exp-row td { color: #0e6fa8; }
    .ps-salary-table tfoot .total-row td { font-weight: 700; background: #e9f6fb; border-top: 2px solid #1B738C; padding: 7px 12px; font-size: 11.5px; }
    .ps-salary-table tfoot .total-row td.amt-col { text-align: right; }

    .ps-net-row { display: flex; justify-content: space-between; align-items: center; background: #1B738C; color: white; border-radius: 6px; padding: 10px 16px; margin-bottom: 10px; }
    .ps-net-label  { font-size: 13px; font-weight: 600; }
    .ps-net-words  { font-size: 10.5px; opacity: .85; margin-top: 3px; font-style: italic; }
    .ps-net-amount { font-size: 22px; font-weight: 800; }

    .ps-footer { text-align: center; font-size: 10px; color: #888; padding-top: 8px; border-top: 1px solid #e0f0f7; }

    @media (max-width: 768px) {
      .ps-emp-grid, .ps-att-strip { grid-template-columns: 1fr; }
      .ps-emp-cell:nth-child(odd) { border-right: none; }
      .ps-att-strip { grid-template-columns: repeat(3,1fr); }
    }

    @media print {
      body * { visibility: hidden; }
      #payslipToPrint, #payslipToPrint * { visibility: visible; }
      #payslipToPrint {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>

<script>
'use strict';

/* ─── Pre-flight: guard against missing jsPDF ───────────────── */
window.__payrollReady = false;

document.addEventListener('DOMContentLoaded', function () {

  /* ══════════════════════════════════════════════════════════════
     CONSTANTS
  ══════════════════════════════════════════════════════════════ */
  var BASE_URL  = 'http://localhost:8086';
  var MONTH_MAP = {
    JANUARY:'January', FEBRUARY:'February', MARCH:'March',    APRIL:'April',
    MAY:'May',         JUNE:'June',          JULY:'July',      AUGUST:'August',
    SEPTEMBER:'September', OCTOBER:'October', NOVEMBER:'November', DECEMBER:'December'
  };

  /* ══════════════════════════════════════════════════════════════
     STATE
  ══════════════════════════════════════════════════════════════ */
  var allPayslips      = [];
  var filteredPayslips = [];
  var currentSlip      = null;
  var logoBase64       = null;   // cached once after first successful fetch (kept for potential future use)

  /* ══════════════════════════════════════════════════════════════
     UTILITIES
  ══════════════════════════════════════════════════════════════ */

  /** Safe number: converts null / undefined / NaN → 0 */
  function n(v) { return (v === null || v === undefined || isNaN(v)) ? 0 : parseFloat(v); }

  /** Format number as Indian locale string (no symbol) */
  function fmtNum(v) { return n(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  /** Format for HTML display with ₹ symbol */
  function fmtINR(v) { return '\u20B9' + fmtNum(v); }

  function formatDate(iso) {
    if (!iso) return 'N/A';
    try { return new Date(iso).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }); }
    catch(e) { return 'N/A'; }
  }

  function statusBadgeClass(status) {
    switch ((status || '').toUpperCase()) {
      case 'PAID':       return 'bg-green-100 text-green-700';
      case 'PROCESSED':  return 'bg-blue-100 text-blue-700';
      case 'PROCESSING': return 'bg-yellow-100 text-yellow-700';
      case 'DRAFT':      return 'bg-slate-100 text-slate-600';
      case 'FAILED':     return 'bg-red-100 text-red-600';
      case 'CANCELLED':  return 'bg-orange-100 text-orange-600';
      default:           return 'bg-slate-100 text-slate-600';
    }
  }

  function numberToWords(num) {
    var a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
             'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen',
             'Eighteen','Nineteen'];
    var b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
    function iW(n) {
      if (n < 20)       return a[n];
      if (n < 100)      return b[Math.floor(n/10)] + (n%10 ? ' '+a[n%10] : '');
      if (n < 1000)     return a[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' '+iW(n%100) : '');
      if (n < 100000)   return iW(Math.floor(n/1000)) + ' Thousand' + (n%1000 ? ' '+iW(n%1000) : '');
      if (n < 10000000) return iW(Math.floor(n/100000)) + ' Lakh' + (n%100000 ? ' '+iW(n%100000) : '');
      return iW(Math.floor(n/10000000)) + ' Crore' + (n%10000000 ? ' '+iW(n%10000000) : '');
    }
    return iW(Math.round(num)) + ' Rupees Only';
  }

  function showToast(msg, type) {
    var bg = type === 'success' ? '#6faf2e' : type === 'error' ? '#e56c6c' : '#1f6f7f';
    Toastify({ text: msg, duration: 3500, gravity: 'bottom', position: 'right',
      backgroundColor: bg,
      style: { borderRadius:'10px', padding:'12px 16px', fontSize:'14px', fontWeight:'500' }
    }).showToast();
  }

  /* ══════════════════════════════════════════════════════════════
     LOGO  –  fetch once as base64 (kept from original; harmless,
     no longer required by PDF generation since html2pdf captures
     the live <img> tag directly).
  ══════════════════════════════════════════════════════════════ */
  function preloadLogo() {
    return new Promise(function(resolve) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        try {
          var canvas = document.createElement('canvas');
          canvas.width  = img.naturalWidth  || img.width;
          canvas.height = img.naturalHeight || img.height;
          canvas.getContext('2d').drawImage(img, 0, 0);
          logoBase64 = canvas.toDataURL('image/png');
        } catch(e) {
          logoBase64 = null;   // CORS or taint – degrade gracefully
        }
        resolve();
      };
      img.onerror = function() { logoBase64 = null; resolve(); };
      img.src = '/Images/logo.png?_cb=' + Date.now();   // bust cache
    });
  }

  /* ══════════════════════════════════════════════════════════════
     HEADER
  ══════════════════════════════════════════════════════════════ */
  function initHeader() {
    var fn  = localStorage.getItem('hrms_first_name')  || '';
    var ln  = localStorage.getItem('hrms_last_name')   || '';
    var des = localStorage.getItem('hrms_designation') || '';
    var dep = localStorage.getItem('hrms_department')  || '';
    var fullName = localStorage.getItem('hrms_full_name') || 'Employee'; 
    var initials = ([fn,ln].filter(Boolean).map(function(x){return x[0];}).join('') || 'E').toUpperCase();
    document.getElementById('userAvatar').textContent = initials;
    document.getElementById('userName').textContent   = fullName;
    document.getElementById('userRole').textContent   = des || dep || 'Employee';
  }

  /* ══════════════════════════════════════════════════════════════
     API
  ══════════════════════════════════════════════════════════════ */
  function loadPayslips() {
    var empId = localStorage.getItem('hrms_employee_id') || '';
    fetch(BASE_URL + '/api/v1/payroll/employee-payroll/' + empId)
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(json) {
        if (!json.success) throw new Error(json.message || 'API error');
        allPayslips = json.data || [];
        populateYearFilter();
        applyFilters();
      })
      .catch(function(err) {
        console.error('[Payroll]', err);
        showToast('Could not load payslips. Please try again.', 'error');
        document.getElementById('payslipGrid').innerHTML = '';
        var es = document.getElementById('emptyState');
        es.classList.remove('hidden');
        es.classList.add('flex');
      });
  }

  /* ══════════════════════════════════════════════════════════════
     FILTERS
  ══════════════════════════════════════════════════════════════ */
  function populateYearFilter() {
    var years = [];
    allPayslips.forEach(function(p) {
      if (years.indexOf(p.payrollYear) === -1) years.push(p.payrollYear);
    });
    years.sort(function(a,b){return b-a;});
    var sel = document.getElementById('yearFilter');
    years.forEach(function(y) {
      var o = document.createElement('option');
      o.value = y; o.text = y;
      sel.appendChild(o);
    });
  }

  function applyFilters() {
    var month = document.getElementById('monthFilter').value;
    var year  = document.getElementById('yearFilter').value;
    filteredPayslips = allPayslips.filter(function(p) {
      return (!month || p.payrollMonth === month) &&
             (!year  || String(p.payrollYear) === year);
    });
    var label = ([month ? MONTH_MAP[month] : '', year].filter(Boolean).join(' ')) || 'All Records';
    document.getElementById('filterLabel').textContent = label;

    /* Show reset button only when at least one filter is active */
    var resetBtn = document.getElementById('resetFilterBtn');
    if (month || year) {
      resetBtn.classList.remove('hidden');
      resetBtn.classList.add('flex');
    } else {
      resetBtn.classList.add('hidden');
      resetBtn.classList.remove('flex');
    }

    renderCards();
  }

  document.getElementById('monthFilter').addEventListener('change', applyFilters);
  document.getElementById('yearFilter').addEventListener('change', applyFilters);

  document.getElementById('resetFilterBtn').addEventListener('click', function() {
    document.getElementById('monthFilter').value = '';
    document.getElementById('yearFilter').value  = '';
    applyFilters();
  });

  /* ══════════════════════════════════════════════════════════════
     CARDS
  ══════════════════════════════════════════════════════════════ */
  function renderCards() {
    var grid  = document.getElementById('payslipGrid');
    var empty = document.getElementById('emptyState');

    if (!filteredPayslips.length) {
      grid.innerHTML = '';
      empty.classList.remove('hidden'); empty.classList.add('flex');
      return;
    }
    empty.classList.add('hidden'); empty.classList.remove('flex');

    grid.innerHTML = filteredPayslips.map(function(slip, idx) {
      var ml   = MONTH_MAP[slip.payrollMonth] || slip.payrollMonth;
      var sc   = statusBadgeClass(slip.status);
      return '<div class="flex flex-col gap-4 p-5 transition-all duration-200 bg-white border border-[#20879bcb] cursor-pointer payslip-card rounded-2xl hover:-translate-y-1 hover:shadow-lg hover:border-primary/40" onclick="window.__openPayslip(' + idx + ')">'
        + '<div class="flex items-start justify-between">'
        +   '<div>'
        +     '<div class="text-base font-semibold font-display text-heading">' + ml + ' ' + slip.payrollYear + '</div>'
        +     '<div class="text-xs text-muted mt-0.5">' + (slip.designation||'') + ' &bull; ' + (slip.department||'') + '</div>'
        +   '</div>'
        +   '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold ' + sc + '">'
        +     '<i class="fas fa-circle text-[6px]"></i> ' + slip.status
        +   '</span>'
        + '</div>'
        + '<div>'
        +   '<div class="text-xs text-muted mb-0.5">Net Pay</div>'
        +   '<div class="text-2xl font-bold font-display text-primary-dk">' + fmtINR(n(slip.netSalary)) + '</div>'
        + '</div>'
        + '<div class="grid grid-cols-3 gap-2 p-3 border border-gray-400 bg-slate-50 rounded-xl">'
        +   '<div class="text-center"><div class="text-[11px] text-muted">Gross</div><div class="text-sm font-semibold text-success">' + fmtINR(n(slip.grossSalary)) + '</div></div>'
        +   '<div class="text-center border-x border-[#20879bcb]"><div class="text-[11px] text-muted">Deductions</div><div class="text-sm font-semibold text-danger">-' + fmtINR(n(slip.totalDeductions)) + '</div></div>'
        +   '<div class="text-center"><div class="text-[11px] text-muted">Net</div><div class="text-sm font-semibold text-primary">' + fmtINR(n(slip.netSalary)) + '</div></div>'
        + '</div>'
        + '<div class="flex gap-2 pt-1 border-t border-border">'
        +   '<button onclick="event.stopPropagation();window.__openPayslip(' + idx + ')" class="flex items-center justify-center flex-1 gap-2 py-2 text-xs font-semibold transition-colors border cursor-pointer rounded-xl text-primary bg-primary-lt border-primary/20 hover:bg-primary/10"><i class="fas fa-eye"></i> View</button>'
        +   '<button onclick="event.stopPropagation();window.__downloadPDF(' + idx + ')" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-xl text-xs font-semibold text-white transition-all hover:-translate-y-0.5 hover:shadow-md cursor-pointer border-none" style="background:linear-gradient(135deg,#1f6f7f,#145c6b)"><i class="fas fa-download"></i> Download</button>'
        + '</div>'
        + '</div>';
    }).join('');
  }

  /* ══════════════════════════════════════════════════════════════
     PAYSLIP DOCUMENT BUILDER
     Produces the exact same markup/classes as admin payslips.html
     openPayslip(). Used for BOTH the modal preview and the PDF
     export, so the two can never drift out of sync again.
  ══════════════════════════════════════════════════════════════ */
  function buildPayslipHtml(s) {
    var ml       = MONTH_MAP[s.payrollMonth] || s.payrollMonth;
    var basic    = n(s.basicSalary);
    var hra      = n(s.hra);
    var da       = n(s.da);
    var spl      = n(s.specialAllowance);
    var gross    = n(s.grossSalary);
    var empPf    = n(s.employeePf);
    var emplrPf  = n(s.employerPf);
    var esi      = n(s.esi);
    var pt       = n(s.pt);
    var totalDed = n(s.totalDeductions);
    var net      = n(s.netSalary);
    var expReimb = n(s.expenseReimbursement);
    var lopDed   = n(s.lopDeduction);
    var lopDays  = n(s.lopDays);
    var daysWkd  = s.daysWorked         != null ? s.daysWorked         : '\u2014';
    var wkDays   = s.workingDaysInMonth != null ? s.workingDaysInMonth : '\u2014';
    var paidDays = s.daysWorked         != null ? s.daysWorked         : '\u2014';
    var words    = numberToWords(Math.round(net));

    var f = function(v){ return parseFloat(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); };

    var logoHtml = '<div class="ps-company-logo-wrap">'
      + '<img src="/Images/logo.png" alt="Company Logo"'
      + ' onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'"'
      + ' style="width:44px;height:44px;object-fit:contain;">'
      + '<div class="ps-logo-fallback" style="display:none;">SIEC</div>'
      + '</div>';

    var html =
      '<div id="payslipToPrint" class="payslip-container">'

      /* ── Company Header ── */
      + '<div class="ps-header">'
      +   '<div class="ps-company-row">'
      +     logoHtml
      +     '<div class="ps-company-text">'
      +       '<div class="ps-company-name">Sustainable Integrated Environmental Consultant.</div>'
      +       '<div class="ps-company-addr">Office-401, Sanskriti Arcade, Kaspate Wasti, Wakad, Pune - 411057</div>'
      +     '</div>'
      +   '</div>'
      +   '<div class="ps-month-row">PAYSLIP FOR THE MONTH OF ' + ml.toUpperCase() + '</div>'
      + '</div>'

      /* ── Employee Detail Grid (6 cells — matches admin payslips.html) ── */
      + '<div class="ps-emp-grid">'
      +   '<div class="ps-emp-cell"><span class="ps-emp-label">Name</span><span class="ps-emp-value">'         + (s.fullName    ||'\u2014') + '</span></div>'
      +   '<div class="ps-emp-cell"><span class="ps-emp-label">Emp. Code</span><span class="ps-emp-value">'    + (s.employeeId  ||'\u2014') + '</span></div>'
      +   '<div class="ps-emp-cell"><span class="ps-emp-label">Designation</span><span class="ps-emp-value">'  + (s.designation ||'\u2014') + '</span></div>'
      +   '<div class="ps-emp-cell"><span class="ps-emp-label">Department</span><span class="ps-emp-value">'   + (s.department  ||'\u2014') + '</span></div>'
      +   '<div class="ps-emp-cell"><span class="ps-emp-label">Pay Period</span><span class="ps-emp-value">'   + ml + '</span></div>'
      +   '<div class="ps-emp-cell"><span class="ps-emp-label">Status</span><span class="ps-emp-value">'       + (s.status      ||'\u2014') + '</span></div>'
      + '</div>'

      /* ── Attendance Strip ── */
      + '<div class="ps-att-strip">'
      +   '<div class="ps-att-head">Attendance Summary</div>'
      +   '<div class="ps-att-cell"><div class="ps-att-val">'                              + wkDays   + '</div><div class="ps-att-lbl">Working Days</div></div>'
      +   '<div class="ps-att-cell"><div class="ps-att-val paid">'                         + daysWkd  + '</div><div class="ps-att-lbl">Days Worked</div></div>'
      +   '<div class="ps-att-cell"><div class="ps-att-val lop">'                          + lopDays  + '</div><div class="ps-att-lbl">LOP Days</div></div>'
      +   '<div class="ps-att-cell"><div class="ps-att-val paid">'                         + paidDays + '</div><div class="ps-att-lbl">Days Paid</div></div>'
      +   '<div class="ps-att-cell"><div class="ps-att-val ' + (lopDed>0?'lop':'') + '">' + f(lopDed)   + '</div><div class="ps-att-lbl">LOP Deduction</div></div>'
      +   '<div class="ps-att-cell"><div class="ps-att-val" style="color:#0e6fa8">'        + f(expReimb) + '</div><div class="ps-att-lbl">Exp. Reimb.</div></div>'
      + '</div>'

      /* ── Salary Table ── */
      + '<table class="ps-salary-table">'
      + '<thead><tr>'
      + '<th style="width:36%">Earnings</th><th class="amt-col" style="width:14%">Amount (\u20B9)</th>'
      + '<th style="width:36%">Deductions</th><th class="amt-col" style="width:14%">Amount (\u20B9)</th>'
      + '</tr></thead>'
      + '<tbody>'
      + '<tr><td>Basic</td><td class="amt-col">'                + f(basic)   + '</td><td>PF (Employee)</td><td class="amt-col">'         + f(empPf)   + '</td></tr>'
      + '<tr><td>HRA</td><td class="amt-col">'                  + f(hra)     + '</td><td>PF (Employer)</td><td class="amt-col">'         + f(emplrPf) + '</td></tr>'
      + '<tr><td>DA</td><td class="amt-col">'                   + f(da)      + '</td><td>ESIC</td><td class="amt-col">'                  + (esi>0?f(esi):'NA') + '</td></tr>'
      + '<tr><td>Special Allowance</td><td class="amt-col">'    + f(spl)     + '</td><td>Professional Tax (PT)</td><td class="amt-col">' + f(pt)      + '</td></tr>'
      + (expReimb>0 ? '<tr class="exp-row"><td>Expense Reimbursement</td><td class="amt-col">+' + f(expReimb) + '</td><td></td><td></td></tr>' : '')
      + (lopDed>0   ? '<tr class="lop-row"><td></td><td></td><td>Loss of Pay (' + lopDays + ' day' + (lopDays===1?'':'s') + ')</td><td class="amt-col">-' + f(lopDed) + '</td></tr>' : '')
      + '</tbody>'
      + '<tfoot><tr class="total-row">'
      + '<td>Gross Earnings</td><td class="amt-col">' + f(gross) + '</td>'
      + '<td>Total Deductions</td><td class="amt-col">' + f(totalDed + lopDed) + '</td>'
      + '</tr></tfoot>'
      + '</table>'

      /* ── Net Pay ── */
      + '<div class="ps-net-row">'
      + '<div><div class="ps-net-label">NET PAY (Take Home)</div>'
      + '<div class="ps-net-words">' + words + '</div></div>'
      + '<div class="ps-net-amount">\u20B9 ' + f(net) + '</div>'
      + '</div>'

      + '<div class="ps-footer">This is a Computer Generated Payslip and does not require Signature.<br>'
      + 'For any discrepancies, please contact HR department within 7 days.</div>'
      + '</div>';

    return html;
  }

  /* ══════════════════════════════════════════════════════════════
     PAYSLIP MODAL
  ══════════════════════════════════════════════════════════════ */
  function openModal(idx) {
    currentSlip = filteredPayslips[idx];
    document.getElementById('payslipDocContent').innerHTML = buildPayslipHtml(currentSlip);

    /* Show modal */
    var overlay = document.getElementById('modalOverlay');
    var box     = document.getElementById('modalBox');
    overlay.style.visibility = 'visible';
    overlay.classList.remove('opacity-0', 'invisible');
    overlay.classList.add('opacity-100');
    box.classList.remove('scale-95');
    box.classList.add('scale-100');
  }

  function closeModal() {
    var overlay = document.getElementById('modalOverlay');
    var box     = document.getElementById('modalBox');
    overlay.classList.remove('opacity-100');
    overlay.classList.add('opacity-0');
    box.classList.add('scale-95');
    box.classList.remove('scale-100');
    setTimeout(function() { overlay.style.visibility = 'hidden'; }, 280);
  }

  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  /* ══════════════════════════════════════════════════════════════
     PDF GENERATION  –  html2pdf on the real payslip DOM, same
     technique as admin payslips.html downloadPayslipPDF(). This
     guarantees the PDF always matches the on-screen preview
     exactly, since both are built from buildPayslipHtml().

     Works whether the modal is currently open (View → Download)
     or not (card's direct Download button): if the slip being
     requested isn't the one currently rendered in the modal, it's
     rendered into an off-screen container first, captured, then
     removed.
  ══════════════════════════════════════════════════════════════ */
  function downloadPayslipPDF(slip) {
    if (!slip) { showToast('Payslip not found.', 'error'); return; }

    var ml   = MONTH_MAP[slip.payrollMonth] || slip.payrollMonth;
    var name = (slip.fullName || 'Employee').replace(/\s+/g,'_');
    var opt = {
      margin: [.35,.35,.35,.35],
      filename: 'Salary_Slip_' + name + '_' + slip.payrollMonth + '_' + slip.payrollYear + '.pdf',
      image: { type:'jpeg', quality:.98 },
      html2canvas: { scale:2, useCORS:true },
      jsPDF: { unit:'in', format:'a4', orientation:'portrait' }
    };

    var isOpenInModal = currentSlip === slip &&
      document.getElementById('modalOverlay').classList.contains('opacity-100');

    if (isOpenInModal) {
      var el = document.getElementById('payslipToPrint');
      html2pdf().set(opt).from(el).save()
        .then(function(){ showToast(ml + ' ' + slip.payrollYear + ' payslip downloaded!', 'success'); })
        .catch(function(){ showToast('PDF generation failed.', 'error'); });
      return;
    }

    // Not currently shown in modal (e.g. card's Download button) —
    // render off-screen, capture, then clean up.
    var holder = document.createElement('div');
    holder.style.position = 'fixed';
    holder.style.left = '-9999px';
    holder.style.top  = '0';
    holder.innerHTML = buildPayslipHtml(slip);
    document.body.appendChild(holder);

    var offEl = holder.querySelector('#payslipToPrint');
    html2pdf().set(opt).from(offEl).save()
      .then(function(){ showToast(ml + ' ' + slip.payrollYear + ' payslip downloaded!', 'success'); })
      .catch(function(){ showToast('PDF generation failed.', 'error'); })
      .finally(function(){ document.body.removeChild(holder); });
  }

  /* ── Download button on modal ── */
  document.getElementById('downloadPdfBtn').addEventListener('click', function() {
    if (currentSlip) downloadPayslipPDF(currentSlip);
  });

  /* ══════════════════════════════════════════════════════════════
     GLOBAL BRIDGES  (called from inline onclick on card buttons)
     Defined INSIDE DOMContentLoaded so they close over the state.
  ══════════════════════════════════════════════════════════════ */
  window.__openPayslip = function(idx) { openModal(idx); };
  window.__downloadPDF = function(idx) {
    downloadPayslipPDF(filteredPayslips[idx]);
  };

  /* ══════════════════════════════════════════════════════════════
     SIDEBAR
  ══════════════════════════════════════════════════════════════ */
  var sidebar    = document.getElementById('sidebar');
  var mainCnt    = document.getElementById('mainContent');
  var pageHdr    = document.getElementById('pageHeader');
  var colIcon    = document.getElementById('collapseIcon');
  var mobileBtn  = document.getElementById('mobileToggleBtn');

  document.getElementById('collapseSidebarBtn').addEventListener('click', function() {
    var isCollapsed = sidebar.style.width === '80px';
    var w = isCollapsed ? '260px' : '80px';
    sidebar.style.width       = w;
    mainCnt.style.marginLeft  = w;
    pageHdr.style.left        = w;
    colIcon.style.transform   = isCollapsed ? '' : 'rotate(180deg)';
    sidebar.querySelectorAll('.nav-text,.logo-text').forEach(function(el) {
      el.style.display = isCollapsed ? '' : 'none';
    });
  });

  mobileBtn.addEventListener('click', function() {
    sidebar.classList.toggle('mobile-open');
  });

  document.addEventListener('click', function(e) {
    if (window.innerWidth < 768 && sidebar.classList.contains('mobile-open')
        && !sidebar.contains(e.target) && e.target !== mobileBtn) {
      sidebar.classList.remove('mobile-open');
    }
  });

  /* ══════════════════════════════════════════════════════════════
     PROFILE DROPDOWN
  ══════════════════════════════════════════════════════════════ */
  var profileBtn      = document.getElementById('profileDropdownBtn');
  var profileDropdown = document.getElementById('profileDropdown');

  profileBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    var isOpen = profileDropdown.classList.contains('opacity-100');
    if (isOpen) {
      profileDropdown.classList.add('opacity-0','invisible','-translate-y-2');
      profileDropdown.classList.remove('opacity-100','translate-y-0');
    } else {
      profileDropdown.classList.remove('opacity-0','invisible','-translate-y-2');
      profileDropdown.classList.add('opacity-100','translate-y-0');
    }
  });

  document.addEventListener('click', function() {
    profileDropdown.classList.add('opacity-0','invisible','-translate-y-2');
    profileDropdown.classList.remove('opacity-100','translate-y-0');
  });

  /* ══════════════════════════════════════════════════════════════
     LOGOUT
  ══════════════════════════════════════════════════════════════ */


  /* ══════════════════════════════════════════════════════════════
     BOOT  –  preload logo then start everything
  ══════════════════════════════════════════════════════════════ */
  initHeader();
  preloadLogo().then(function() {
    loadPayslips();
  });

}); /* end DOMContentLoaded */
</script>
